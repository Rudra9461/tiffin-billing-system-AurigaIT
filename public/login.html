<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login - Tiffin Billing</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container" style="max-width:400px; margin-top:60px;">
  <div class="card">
    <h2 id="formTitle">Owner Login</h2>
    <div id="msg"></div>

    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" style="width:100%" />
      <input type="password" id="loginPassword" placeholder="Password" style="width:100%" />
      <button onclick="login()" style="width:100%">Login</button>
      <p style="margin-top:10px">No account? <a href="#" onclick="showRegister()">Register</a></p>
    </div>

    <div id="registerForm" style="display:none">
      <input type="text" id="regName" placeholder="Name" style="width:100%" />
      <input type="email" id="regEmail" placeholder="Email" style="width:100%" />
      <input type="password" id="regPassword" placeholder="Password" style="width:100%" />
      <button onclick="register()" style="width:100%">Register</button>
      <p style="margin-top:10px">Have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>
  </div>
</div>

<script>
function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('formTitle').innerText = 'Owner Registration';
  document.getElementById('msg').innerHTML = '';
}
function showLogin() {
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('formTitle').innerText = 'Owner Login';
  document.getElementById('msg').innerHTML = '';
}

async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.innerHTML = `<p class="error">${data.error}</p>`; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (e) { msg.innerHTML = `<p class="error">Network error</p>`; }
}

async function register() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.innerHTML = `<p class="error">${data.error}</p>`; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (e) { msg.innerHTML = `<p class="error">Network error</p>`; }
}
</script>
</body>
</html>
